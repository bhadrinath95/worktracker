{% extends "base.html" %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Decision-Making</h2>
    <a href="{% url 'statements:statement_create' %}" class="btn btn-success">
        + New Statement
    </a>
</div>

<div class="card shadow-sm">
    <div class="card-body p-0">
        <table class="table table-striped mb-0">
            <thead class="table-primary">
                <tr>
                    <th>Title</th>
                    <th>Status</th>
                    <th>Created</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>
                {% for s in statements %}
                    <tr>
                        <td>{{ s.title }}</td>
                        <td>{{ s.get_status_display }}</td>
                        <td>{{ s.created_at|date:"d M Y" }}</td>
                        <td>
                            <a href="{% url 'statements:statement_detail' s.pk %}" 
                               class="btn btn-sm btn-primary">
                                View
                            </a>
                            <a href="{% url 'statements:statement_update' s.pk %}" class="btn btn-sm btn-warning">
                                Edit
                            </a>
                            <a href="{% url 'statements:statement_delete' s.pk %}" class="btn btn-sm btn-danger">
                                Delete
                            </a>
                        </td>
                    </tr>
                {% empty %}
                    <tr>
                        <td colspan="4" class="text-center text-muted py-3">
                            No statements found.
                        </td>
                    </tr>
                {% endfor %}
            </tbody>

        </table>
    </div>
</div>

{% endblock %}
