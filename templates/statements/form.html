{% extends "base.html" %}
{% block content %}
<h1>{{ title }}</h1>
<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">
        Save
    </button>
    <a href="{% url 'statements:tree_view' tree.id %}" class="btn btn-secondary">
        Cancel
    </a>
</form> 
{% endblock %}
