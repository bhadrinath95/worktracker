{% extends "base.html" %}
{% block content %}
<h1>Delete Node</h1>

<p>
    Are you sure you want to delete:
    <strong>
        {{ statement.title }}
    </strong>
</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">
        Delete
    </button>
    <a href="{% url 'statements:tree_view' tree_id %}" class="btn btn-secondary">
        Cancel
    </a>
</form>
{% endblock %}
