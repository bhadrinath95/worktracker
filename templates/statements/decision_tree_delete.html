{% extends "base.html" %}
{% block content %}

<h1>Delete Decision Tree</h1>
<p>
    Are you sure you want to delete
    <strong>
        {{ tree.name }}
    </strong>
    ?
</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">
        Delete
    </button>
    <a href="{% url 'statements:decision_tree_list' %}" class="btn btn-secondary">
        Cancel
    </a>
</form>
{% endblock %}
