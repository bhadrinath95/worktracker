{% extends 'base.html' %}
{% block content %}
<h1>Completed Tasks</h1>

<a href="{% url 'tracker:task_list' %}" class="btn btn-outline-secondary mb-3"><i class="bi bi-arrow-return-left"></i> Back to Tasks</a>

<div class="row mb-3">
    <div class="col-md-4">
        <input 
            type="text" 
            name="search"
            class="form-control"
            placeholder="Search tasks..."
            hx-get="{% url 'tracker:task_history' %}"
            hx-trigger="keyup changed delay:300ms"
            hx-target="#taskTableBody"
            hx-include="#dateFilters"
        />
    </div>

    <div class="col-md-4">
        <input 
            type="date" 
            name="start_date" 
            class="form-control"
            id="dateFilters"
            hx-get="{% url 'tracker:task_history' %}"
            hx-trigger="change"
            hx-target="#taskTableBody"
            hx-include="[name='search'], #dateFilters"
        />
    </div>

    <div class="col-md-4">
        <input 
            type="date" 
            name="end_date" 
            class="form-control"
            hx-get="{% url 'tracker:task_history' %}"
            hx-trigger="change"
            hx-target="#taskTableBody"
            hx-include="[name='search'], #dateFilters"
        />
    </div>
</div>

<div class="table-responsive">
<table class="table table-striped table-bordered align-middle text-nowrap">
  <thead>
      <tr>
          <th>Name</th>
          <th>Completed On</th>
          <th>Status</th>
          <th>Actions</th>
      </tr>
  </thead>

  <tbody id="taskTableBody">
      {% include 'tracker/task_history_rows.html' %}
  </tbody>
</table>
</div>
{% endblock %}
{% block static %}
<script src="https://unpkg.com/htmx.org@1.9.9"></script>
{% endblock %}
