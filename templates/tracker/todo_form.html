{% extends 'base.html' %}
{% block style %}
    <style>
    form table{
        border-collapse: separate;
        border-spacing: 0 10px;  /* vertical row spacing */
    }

    form th{
        text-align: left;
        padding-right: 10px;
    }

    form td{
        padding: 5px;
    }

    input, textarea{
        width: 100%;
        padding: 6px;
    }
    </style>
{% endblock %}
{% block content %}
<h1>Edit Task</h1>
<a href="{% url 'tracker:todo_list' %}" class="btn btn-outline-secondary mb-3"><i class="bi bi-arrow-return-left"></i> Back to To Do List</a>

<form method="POST">
{% csrf_token %}
    <table>
        {{ form.as_table }}
    </table>
<button type="submit" class="btn btn-primary">Update</button>
</form>
{% endblock %}
