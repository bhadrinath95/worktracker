{% extends "journal/base_journal.html" %}
{% block journal_content %}
<div class="journal-form-card">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="h4 mb-0">{{ page_title }}</h2>
    <a href="{% url 'journal:view_topic' %}" class="btn btn-sm btn-outline-secondary">Back</a>
  </div>
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
      <div class="mb-3">
        <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
        {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
      </div>
    {% endfor %}
    <button class="btn btn-primary" type="submit">Save Topic</button>
    <a class="btn btn-light" href="{% url 'journal:view_topic' %}">Cancel</a>
  </form>
</div>
{% endblock %}
