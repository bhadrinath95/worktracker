{% extends "journal/base_journal.html" %}
{% block style %}
{% load static %}

<link rel="stylesheet" href="{% static 'css/journal.css' %}">

<style>
.journal-story-page {
    min-height: 100vh;
    background-color: white;
    background-size: auto;
    background-position: top left;
    background-repeat: repeat;
    background-image: url('{{ story.desktop_background_url|escape }}');
}

@media (max-width: 767.98px) {
    .journal-story-page {
        background-image: url('{{ story.mobile_background_url|escape }}');
    }
}
</style>

{% endblock %}

{% block journal_content %}
<article class="journal-story-page">
  <div class="journal-detail-toolbar">
    <a class="btn btn-sm btn-secondary" href="{% url 'journal:view_story' story.topic_id %}"><i class="bi bi-arrow-left"></i> {{ story.topic.name }}</a>
    <div class="d-flex gap-2">
      <a class="btn btn-sm btn-primary" href="{% url 'journal:modify_story' story.pk %}"><i class="bi bi-pencil"></i> Edit</a>
      <a class="btn btn-sm btn-success" href="{% url 'journal:detail_story_print' story.pk %}" target="_blank">
          <i class="bi bi-printer"></i> Print
      </a>
      <form method="post" action="{% url 'journal:delete_story' story.pk %}" onsubmit="return confirm('Delete this story?');">
        {% csrf_token %}<button class="btn btn-sm btn-danger" type="submit"><i class="bi bi-trash"></i> Delete</button>
      </form>
    </div>
  </div>
  <div class="journal-topic-label">{{ story.topic.name }}</div>
  {% include "journal/journal_content.html" %}
  <div class="journal-detail-footer">
    <a href="{% url 'journal:view_story' story.topic_id %}"><i class="bi bi-arrow-left"></i> Back to {{ story.topic.name }}</a>
  </div>
</article>
{% endblock %}
