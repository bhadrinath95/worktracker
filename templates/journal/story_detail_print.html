<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{{ blog.title }}</title>

    {% load static %}

    <link rel="stylesheet" href="{% static 'css/journal.css' %}">

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 20px;
        }

        .journal-story-page {
            position: relative;
            min-height: 100vh;
            background-color: white;
            overflow: hidden;
        }

        /* Background image */
        .journal-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top left;
            z-index: 0;
            pointer-events: none;
        }

        /* Journal content */
        .journal-story-content {
            position: relative;
            z-index: 1;
        }

        .no-print {
            display: none;
        }

        .page-break {
            page-break-after: always;
            break-after: page;
        }

        /* Mobile background */
        @media screen and (max-width: 767.98px) {
            .journal-background {
                content: url('https://raw.githubusercontent.com/tenctech10c/Images/main/friendship.png');
            }
        }

        /* Print settings */
        @media print {

            @page {
                margin: 10mm;
            }

            html,
            body {
                margin: 0 !important;
                padding: 0 !important;
                background: white !important;
            }

            .journal-story-page {
                position: relative;
                min-height: 100vh;
                overflow: visible;
            }

            .journal-background {
                display: block !important;
                content: url('https://raw.githubusercontent.com/tenctech10c/Images/main/friendshipdesktop.png') !important;
                position: absolute !important;
                top: 0 !important;
                left: 0 !important;
                width: 100% !important;
                height: 100% !important;
                object-fit: cover !important;
                object-position: top left !important;
                z-index: 0 !important;
            }

            .journal-story-content {
                position: relative;
                z-index: 1;
            }

            .no-print {
                display: none !important;
            }

            .page-break {
                page-break-after: always;
                break-after: page;
                   }

            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
    </style>
</head>

<body>

    <div class="journal-story-page">

        <img
            class="journal-background"
            src="https://raw.githubusercontent.com/tenctech10c/Images/main/friendshipdesktop.png"
            alt=""
        >

        <div class="journal-story-content">

            {% include "journal/journal_content.html" %}

        </div>

    </div>

    <script>
        window.onload = function () {

            const images = document.querySelectorAll('img');

            Promise.all(
                Array.from(images).map(function (img) {
                    if (img.complete) {
                        return Promise.resolve();
                    }

                    return new Promise(function (resolve) {
                        img.onload = resolve;
                        img.onerror = resolve;
                    });
                })
            ).then(function () {
                window.print();
            });

        };
    </script>

</body>
</html>
