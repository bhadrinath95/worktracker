{% extends "base.html" %}

{% block content %}
{% if not request.user.is_authenticated %}
    <div style="margin-top: 30px;">
        <form method="POST">
            {% csrf_token %}
            <table>
                {{ form.as_table }}
            </table>
            <button type="submit">Login</button>
        </form>
        <p>Need an account ? Please <a href='{% url "register" %}'>Register</a></p>
    </div>
{% else %}
    <p>You're already logged in. Would you like to <a href='{% url "logout" %}'>logout</a> ?</p>
{% endif %}
{% endblock content %}
