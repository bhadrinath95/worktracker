{% extends "base.html" %}

{% block content %}
{% if request.user.is_authenticated %}
<div class="container mt-5" style="max-width: 400px;">
    <h3 class="mb-3 text-center">Logout</h4>
    <div class="card shadow p-4">
        <div class="text-center mb-3">
            <img src="https://raw.githubusercontent.com/tenctech10c/Document/main/Logo.png"
                 alt="logo"
                 style="max-width: 120px; cursor: pointer;"
                 data-bs-toggle="modal"
                 data-bs-target="#imageModal">
        </div>
        <p class="mb-4 text-center">Are you sure you want to logout?</p>
        <form method="POST" class="d-flex justify-content-between">
            {% csrf_token %}
            <a href="{% url 'tracker:task_list' %}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-danger">Yes, logout</button>
        </form>
    </div>
</div>

<div class="modal fade" id="imageModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content bg-transparent border-0 text-center">
      
      <div class="modal-body p-0" data-bs-dismiss="modal">
        <img src="https://raw.githubusercontent.com/tenctech10c/Document/main/iconfullimage.jpg"
             alt="Full Image"
             style="width: 100%; border-radius: 10px;">
      </div>

    </div>
  </div>
</div>

{% else %}
<div class="container mt-5 text-center">
    <p>You're not already logged in. Would you like to 
        <a href="{% url 'login' %}">login</a>?
    </p>
</div>
{% endif %}
{% endblock content %}
