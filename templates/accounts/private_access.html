{% extends "base.html" %}

{% block content %}
{% if messages %}
  <div class="container mt-3">
    {% for message in messages %}
          <div class="alert
        {% if message.tags == 'error' %}
            alert-danger
        {% else %}
            alert-{{ message.tags }}
        {% endif %}
        alert-dismissible fade show"
        role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
    {% endfor %}
  </div>
{% endif %}

<div class="container mt-5" style="max-width: 500px;">
    <h3 class="mb-3 text-center">Enter Private Access Password</h3>

    <form method="post" class="card shadow p-4">
        <div class="text-center mb-3">
          <img src="https://raw.githubusercontent.com/tenctech10c/Document/main/Logo.png"
                 alt="logo"
                 style="max-width: 120px; cursor: pointer;"
                 data-bs-toggle="modal"
                 data-bs-target="#imageModal">
        </div>
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label fw-bold">Password</label>
            <input type="password" name="password" class="form-control" required placeholder="Enter password">
        </div>

        <button class="btn btn-primary w-100">Unlock Private Tasks</button>
    </form>
</div>

<div class="modal fade" id="imageModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content bg-transparent border-0 text-center">
      
      <div class="modal-body p-0" data-bs-dismiss="modal">
        <img src="https://raw.githubusercontent.com/tenctech10c/Document/main/iconfullimage.jpg"
             alt="Full Image"
             style="width: 100%; border-radius: 10px;">
      </div>

    </div>
  </div>
</div>
{% endblock %}
